name: Shared Content plugin
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install PHP tools
        run: composer install --no-interaction --no-progress
      - name: Coding standards
        run: vendor/bin/phpcs
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install JavaScript tools
        run: npm ci --no-audit --no-fund
      - name: JavaScript lint
        run: npx eslint .
      - name: Shell scripts
        run: shellcheck --severity=warning bin/*.sh docker/*.sh tests/shared-content/*.sh
      - name: Workflow files
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install PHP tools
        run: composer install --no-interaction --no-progress
      - name: Unit tests
        run: vendor/bin/phpunit
  plugin:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: msc-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the plugin version
        id: version
        run: |
          version="$(sed -n 's/^ \* Version: *//p' multisite-shared-content/multisite-shared-content.php | head -n 1)"
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - name: Install ACF and the four-site shared-content test network
        run: sh bin/shared-content.sh setup
      - name: PHP syntax
        run: |
          COMPOSE_FILE=compose.yaml:compose.shared-content.yaml docker compose exec -T wordpress sh -c 'find wp-content/plugins/multisite-shared-content wp-content/themes/msc-screening-room -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Integration, HTTP, concurrency, media and real ACF tests
        run: MSC_DISPOSABLE_TESTS=1 sh bin/shared-content.sh test
      - name: Package release
        run: python3 tools/package-msc.py
      - name: Install packaged plugin ZIP
        run: COMPOSE_FILE=compose.yaml:compose.shared-content.yaml docker compose run --rm -T --entrypoint /bin/sh cli /msc-tests/release.sh
      - name: Browser ACF editing workflow
        run: |
          python3 -m venv /tmp/msc-browser-env
          /tmp/msc-browser-env/bin/pip install playwright==1.62.0
          /tmp/msc-browser-env/bin/python -m playwright install --with-deps chromium
          sh bin/shared-content.sh legacy-demo
          MSC_DISPOSABLE_TESTS=1 /tmp/msc-browser-env/bin/python tests/shared-content/browser.py
          MSC_DISPOSABLE_TESTS=1 /tmp/msc-browser-env/bin/python tests/shared-content/presentation-browser.py
      - name: Browser Show and Episode administration
        run: MSC_DISPOSABLE_TESTS=1 /tmp/msc-browser-env/bin/python tests/shared-content/episode-admin-browser.py
      - name: Browser OMDb search and import workflow
        run: |
          export PATH="/tmp/msc-browser-env/bin:$PATH"
          MSC_DISPOSABLE_TESTS=1 sh bin/omdb-browser-tests.sh
      - name: Browser commercial-source and Episode import workflow
        run: |
          export PATH="/tmp/msc-browser-env/bin:$PATH"
          MSC_DISPOSABLE_TESTS=1 sh bin/open-import-browser-tests.sh
      - name: Browser cold Movie searches and source pacing
        run: |
          export PATH="/tmp/msc-browser-env/bin:$PATH"
          MSC_DISPOSABLE_TESTS=1 sh bin/movie-search-browser-tests.sh
      - name: Browser four-site brands, IGDB and release calendars
        run: |
          export PATH="/tmp/msc-browser-env/bin:$PATH"
          MSC_DISPOSABLE_TESTS=1 sh bin/network-browser-tests.sh
      - name: Browser catalog overview and asynchronous season navigation
        run: MSC_DISPOSABLE_TESTS=1 /tmp/msc-browser-env/bin/python tests/shared-content/season-browser.py
      - name: Browser embedded Google Images search and image imports
        run: |
          export PATH="/tmp/msc-browser-env/bin:$PATH"
          MSC_DISPOSABLE_TESTS=1 sh bin/image-browser-tests.sh
      - name: Browser local and global ACF publication
        run: MSC_DISPOSABLE_TESTS=1 /tmp/msc-browser-env/bin/python tests/shared-content/acf-publication-browser.py
      - name: Browser linked catalog entities and expandable weekly calendars
        run: MSC_DISPOSABLE_TESTS=1 /tmp/msc-browser-env/bin/python tests/shared-content/entities-calendar-browser.py
      - name: Browser bespoke catalog archives and filters
        run: MSC_DISPOSABLE_TESTS=1 /tmp/msc-browser-env/bin/python tests/shared-content/archive-browser.py
      - name: Browser trailer carousels and YouTube selection
        run: MSC_DISPOSABLE_TESTS=1 /tmp/msc-browser-env/bin/python tests/shared-content/trailers-browser.py
      - name: Wikipedia aggregate extraction and editorial-only badges
        run: sh bin/shared-content.sh wp eval-file /msc-tests/wikipedia-scores.php
      - name: Browser editorial reviews, score medals and aggregate imports
        run: MSC_DISPOSABLE_TESTS=1 /tmp/msc-browser-env/bin/python tests/shared-content/reviews-browser.py
      - name: Upload plugin and source packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multisite-shared-content-${{ steps.version.outputs.number }}
          path: dist/
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          cp -R /tmp/msc-* diagnostics/ 2>/dev/null || true
          COMPOSE_FILE=compose.yaml:compose.shared-content.yaml docker compose logs --no-color > diagnostics/compose.log 2>&1 || true
          sh bin/shared-content.sh wp msc status > diagnostics/queue-status.txt 2>&1 || true
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics
          path: diagnostics/
          if-no-files-found: ignore
      - name: Stop services
        if: always()
        run: COMPOSE_FILE=compose.yaml:compose.shared-content.yaml docker compose down --volumes
